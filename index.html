<script>
const KEY='khm-accounts-v2';
const SEED=null; /* data removed: kept only in encrypted vault */
const $=q=>document.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const N=v=>Number(v)||0;
const LOCALE_OPTS={'en-IN':'Lakh style (1,00,000)','en-US':'Western (100,000)','none':'No grouping (100000)'};
const fm=v=>{const n=Number(N(v).toFixed(2));const g=(S&&S.locale&&S.locale.grouping)||'en-IN';
  return g==='none'?String(n):n.toLocaleString(g,{maximumFractionDigits:2});};
const idx=ym=>{const[y,m]=ym.split('-').map(Number);return y*12+m-1};
const ymOf=i=>Math.floor(i/12)+'-'+String(i%12+1).padStart(2,'0');
const EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const BN=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const mEN=ym=>EN[+ym.slice(5)-1]+' '+ym.slice(0,4);
const mBN=ym=>BN[+ym.slice(5)-1]+' '+ym.slice(0,4);
const mSh=ym=>ym?EN[+ym.slice(5)-1]+' '+ym.slice(0,4):'';
const CASH=['Cash',"Jumu'ah",'Other Donation'],BANK=['Bank','Cheque'],BK=['Bkash'];
const METHODS=['Cash',"Jumu'ah",'Bank','Cheque','Bkash','Other Donation'];
const PCAT=['Electricity (Meter Recharge)','Wifi Bill','Necessary Items','Servicing & Maintenance'];
const RESID='Monthly Hadiya (Remuneration)';
const BTYPES={'Cash Deposit':['cr',true],'Cash Withdrawal':['dr',true],'Bank Charge':['dr',false],'Cheque / Other Deposit':['cr',false]};
let S,mo,tab='dash',filt='all',prevId=null;

/* ---------- encrypted vault (AES-GCM + PBKDF2) ---------- */
let VKEY='khm-vault-v1';const ITER=600000,IDLE=5*60*1000;
const b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let CK=null,SALT=null,saveQ=Promise.resolve(),idleT=null,fails=0;
async function dKey(pw,salt,it){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encStr(s,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(s));
  return {app:'khm',v:1,it:ITER,salt:b64(salt),iv:b64(iv),ct:b64(ct)}}
async function decPayload(p,key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p.iv)},key,unb64(p.ct));return JSON.parse(new TextDecoder().decode(pt))}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
/* ---------- several mosques on one device: each has its own encrypted vault and password ---------- */
const MKEY='khm-mosques',MACT='khm-mosque-active';
const vkeyOf=id=>id==='khm'?'khm-vault-v1':'khm-vault-v1-'+id;
let MOSQ=(()=>{try{const a=JSON.parse(lsGet(MKEY));if(Array.isArray(a)&&a.length)return a}catch(e){}return [{id:'khm',name:'Khulshi Hills Masjid',addr:'North Khulshi, Road No-1, Khulshi, Chattogram.'}]})();
let MCUR=lsGet(MACT)||'khm';if(!MOSQ.some(m=>m.id===MCUR))MCUR='khm';VKEY=vkeyOf(MCUR);
const mCur=()=>MOSQ.find(m=>m.id===MCUR)||MOSQ[0],MNAME=()=>mCur().name,MADDR=()=>mCur().addr||'';
const mSave=()=>{try{localStorage.setItem(MKEY,JSON.stringify(MOSQ));localStorage.setItem(MACT,MCUR)}catch(e){}};
const mosqPicker=()=>`<p class="bar"><select aria-label="Mosque" onchange="switchMosque(this.value)">${MOSQ.map(m=>`<option value="${esc(m.id)}" ${m.id===MCUR?'selected':''}>${esc(m.name)}</option>`).join('')}</select><button onclick="addMosque()">+ Add mosque</button></p>`;
window.switchMosque=id=>{if(CK||!MOSQ.some(m=>m.id===id))return;MCUR=id;VKEY=vkeyOf(id);mSave();document.title=MNAME()+' - Accounts';boot()};
window.addMosque=()=>{if(CK)return;const n=(prompt('Mosque name:','')||'').trim();if(!n)return;const a=(prompt('Address (printed on the dashboard header, optional):','')||'').trim();
  const id='m'+Date.now().toString(36);MOSQ.push({id,name:n,addr:a});mSave();switchMosque(id)};
function save(){
  if(CK&&S)vchAssign();
  if(!CK||!S)return true;
  /* transaction: a change that creates a NEW constraint violation is rolled back as a whole */
  const bad=DB.check();
  if(DB.base&&DB.snap){const nw=bad.filter(v=>!DB.base.has(v.key));

  const dates=[...incomes().map(x=>x.d),...S.payments.map(p=>p.date),...S.bank.map(b=>b.date)].filter(Boolean).map(d=>idx(d.slice(0,7)));

    const bO=(S.bankInputs[m]!==undefined&&S.bankInputs[m]!=='')?N(S.bankInputs[m]):b;
    out={cO,cC:cO+f.cashNet,bO,bC:bO+f.bankNet,kO:k,kC:k+f.bkNet,cInput:S.cashInputs[m]!==undefined&&S.cashInputs[m]!=='',bInput:S.bankInputs[m]!==undefined&&S.bankInputs[m]!==''};
    c=out.cC;b=out.bC;k=out.kC;

function words(n){n=Math.round(N(n));if(!n)return 'Zero Taka Only';
  const o='One Two Three Four Five Six Seven Eight Nine Ten Eleven Twelve Thirteen Fourteen Fifteen Sixteen Seventeen Eighteen Nineteen'.split(' '),t='Twenty Thirty Forty Fifty Sixty Seventy Eighty Ninety'.split(' ');
  const b=x=>{let s='';if(x>=100){s+=o[Math.floor(x/100)-1]+' Hundred';x%=100;if(x)s+=' ';}
    if(x>=20){s+=t[Math.floor(x/10)-2];x%=10;if(x)s+='-'+o[x-1];}else if(x>0)s+=o[x-1];return s;};
  let r='';for(const [v,nm] of [[10000000,'Crore'],[100000,'Lakh'],[1000,'Thousand']]){if(n>=v){r+=b(Math.floor(n/v))+' '+nm+' ';n%=v;}}

function pdfBytes(pages){

  obj(2,'<< /Type /Pages /Kids ['+pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] /Count '+pages.length+' >>');
  pages.forEach((p,i)=>{const pid=3+3*i,cid=4+3*i,iid=5+3*i;
    obj(pid,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+p.pw+' '+p.ph+'] /Resources << /XObject << /Im'+i+' '+iid+' 0 R >> /Font << /F1 '+F+' 0 R >> >> /Contents '+cid+' 0 R >>');
    let cs='q '+p.dw.toFixed(2)+' 0 0 '+p.dh.toFixed(2)+' '+p.x.toFixed(2)+' '+p.y.toFixed(2)+' cm /Im'+i+' Do Q';
    if(p.footer)cs+='\nBT /F1 8 Tf '+p.fx.toFixed(2)+' '+p.fy.toFixed(2)+' Td ('+p.footer+') Tj ET';
    obj(cid,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    offs[iid]=len;
    push(iid+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.jpg.length+' >>\nstream\n');
    push(p.jpg);push('\nendstream\nendobj\n');
  });

  const xref=len;

  for(let k=1;k<N;k++)x+=String(offs[k]).padStart(10,'0')+' 00000 n \n';

    const hh=(T&&hBot>hTop)?(hBot-hTop):0;

function dropEmptyCols(node){

  if(y1<=y0)return null;
  const d=ctx.getImageData(0,y0,W2,y1-y0).data;
  const isG=k=>{let c=0;for(const f of xs){const xx=Math.min(W2-1,Math.round((x0+(x1-x0)*f)*S));const i=(k*W2+xx)*4;
    const R=d[i],G=d[i+1],B=d[i+2];if(G>R+15&&G>B+5&&(R+G+B)/3<120)c++;}return c>=3;};
  const runs=[];let s=-1;
  for(let k=0;k<y1-y0;k++){if(isG(k)){if(s<0)s=k;}else if(s>=0){runs.push([s,k-1]);s=-1;}}
  if(s>=0)runs.push([s,y1-y0-1]);
  const cand=runs.filter(([a,b])=>b-a+1>=10&&b-a+1<=80);
  if(!cand.length)return null;
  const target=(T.top+18)*S-y0;
  cand.sort((p,q)=>Math.abs((p[0]+p[1])/2-target)-Math.abs((q[0]+q[1])/2-target));
  const [a,b]=cand[0];
  return {top:(y0+a)/S,bottom:(y0+b+1)/S};
}

const COA=[['1010','Cash in hand','Asset'],['1020','Cash at bank','Asset'],['1030','bKash','Asset'],

 ['4010','Hadiya (monthly donation)','Income'],['4020',"Jumu'ah collection",'Income'],['4030','Other donations','Income'],
 ['4040','Membership fee','Income'],['4090','Unallocated bank deposits','Income'],
 ['5010','Electricity (meter recharge)','Expense'],['5020','Wifi bill','Expense'],['5030','Necessary items','Expense'],

const COA_NAME=Object.fromEntries(COA.map(([c,n])=>[c,n]));
const PAY_ACC={'Electricity (Meter Recharge)':'5010','Wifi Bill':'5020','Necessary Items':'5030','Servicing & Maintenance':'5040'};
const acctOfMethod=m=>CASH.includes(m)?'1010':BANK.includes(m)?'1020':BK.includes(m)?'1030':'1010';
function journalAll(){
  const J=[];
  const seen={};
  const add=(date,ref,lines,note)=>{const dr=lines.reduce((t,l)=>t+l.dr,0),cr=lines.reduce((t,l)=>t+l.cr,0);
    seen[ref]=(seen[ref]||0)+1;const dup=seen[ref]>1;
    J.push({date,ref:dup?ref+' #'+seen[ref]:ref,lines,ok:Math.abs(dr-cr)<0.005,dup,note:note||''})};
  add('1900-01-01','Opening balances',[
    {acc:'1010',dr:N(S.openingCash),cr:0},{acc:'1020',dr:N(S.openingBank),cr:0},{acc:'1030',dr:N(S.openingBkash),cr:0},
    {acc:'3000',dr:0,cr:N(S.openingCash)+N(S.openingBank)+N(S.openingBkash)}]);
  LIVE().forEach(r=>{const a=N(r.amount);if(!a)return;
    const inc=r.method==="Jumu'ah"?'4020':r.method==='Other Donation'?'4030':'4010';
    add(r.date,(r.book&&r.no)?'Receipt '+r.book+'/'+r.no:rctNo(r),[{acc:acctOfMethod(r.method),dr:a,cr:0},{acc:inc,dr:0,cr:a}],r.name||'');});
  S.members.filter(m=>N(m.fee)>0&&m.regDate).forEach(m=>add(m.regDate,'Membership fee '+m.id,
    [{acc:acctOfMethod(m.method),dr:N(m.fee),cr:0},{acc:'4040',dr:0,cr:N(m.fee)}],m.name||''));
  S.payments.filter(p=>!p.cancelled).forEach(p=>{const a=N(p.amount);add(p.date,vchNo(p),
    [{acc:PAY_ACC[p.cat]||'5090',dr:a,cr:0},{acc:'1010',dr:0,cr:a}],(p.cat||'')+(p.part?' - '+p.part:''));});
  S.bank.filter(b=>!b.cancelled).forEach(b=>{const cr=N(b.credit),dr=N(b.debit);const bn=bnkNo(b),bnote=[b.name,b.ref?'slip '+b.ref:''].filter(Boolean).join(' / ');
    if(b.type==='Cash Deposit')add(b.date,bn,[{acc:'1020',dr:cr,cr:0},{acc:'1010',dr:0,cr:cr}],bnote);
    else if(b.type==='Cash Withdrawal')add(b.date,bn,[{acc:'1010',dr:dr,cr:0},{acc:'1020',dr:0,cr:dr}],bnote);
    else if(b.type==='Bank Charge')add(b.date,bn,[{acc:'5100',dr:dr,cr:0},{acc:'1020',dr:0,cr:dr}],bnote);
    else if(cr)add(b.date,bn,[{acc:'1020',dr:cr,cr:0},{acc:'4090',dr:0,cr:cr}],bnote);});
  // typed monthly actual openings: the difference to the book is posted explicitly to 3900 on the 1st of that month
  const bookAt=(acc,m)=>J.filter(j=>j.date.slice(0,7)<m).reduce((t,j)=>t+j.lines.filter(l=>l.acc===acc).reduce((u,l)=>u+l.dr-l.cr,0),0);
  [...new Set([...Object.keys(S.cashInputs||{}),...Object.keys(S.bankInputs||{})])].sort().forEach(m=>{
    [['1010','cashInputs'],['1020','bankInputs']].forEach(([acc,key])=>{
      const v=(S[key]||{})[m];if(v===undefined||v==='')return;
      const diff=Math.round((N(v)-bookAt(acc,m))*100)/100;if(Math.abs(diff)<0.005)return;
      add(m+'-01','Typed opening adjustment '+COA_NAME[acc]+' '+m,
        diff>0?[{acc,dr:diff,cr:0},{acc:'3900',dr:0,cr:diff}]:[{acc,dr:0,cr:-diff},{acc:'3900',dr:-diff,cr:0}]);
    });
  });
  return J;
}

function runTests(){

  T('Every journal has Debit = Credit',()=>{const b=J.filter(j=>!j.ok);return b.length?b.length+' unbalanced: '+lst(b.map(j=>j.ref)):''});
  T('Journal references are unique',()=>{const d=J.filter(j=>j.dup);return d.length?lst(d.map(j=>j.ref+' ('+j.date+')')):''},true);
  T('Trial balance balances in every month',()=>{const b=months.filter(m=>!Acct.trialBalance(m).ok);return b.length?lst(b):''});
  T('Ledger agrees with the cash book (cash, bank, bKash) in every month',()=>{const b=[];months.forEach(m=>{const t=Acct.trialBalance(m).bal,L=Acct.ledger(m);
    [['1010',L.cC],['1020',L.bC],['1030',L.kC]].forEach(([a,v])=>{if(Math.abs(t[a].dr-t[a].cr-v)>=0.5)b.push(m+' '+a)})});return b.length?lst(b):''});
  T('Income: journal = cash book (selected month)',()=>{const t=Acct.trialBalance(mo).bal,p=months.length>1?Acct.trialBalance(ymOf(idx(mo)-1)).bal:null;
    const g=x=>['4010','4020','4030','4040'].reduce((a,c)=>a+(x?x[c].cr:0),0);const j=Math.round((g(t)-g(p))*100)/100,c=Math.round(sumA(incomes().filter(x=>x.d.slice(0,7)===mo))*100)/100;

  T('Expense: journal = cash book (selected month)',()=>{const t=Acct.trialBalance(mo).bal,p=months.length>1?Acct.trialBalance(ymOf(idx(mo)-1)).bal:null;
    const g=x=>['5010','5020','5030','5040','5090','5100'].reduce((a,c)=>a+(x?x[c].dr:0),0);const f=Acct.flows(mo),j=Math.round((g(t)-g(p))*100)/100,c=Math.round((f.pay+f.charges)*100)/100;
    return Math.abs(j-c)<0.5?'':'journal '+fm(j)+' vs cash book '+fm(c)});
  T('Due / advance: independent recount for every member (selected month)',()=>{const R=idx(mo),b=[];
    Acct.dues(mo).forEach(x=>{const m=x.m,c=N(m.commit);if(c<=0)return;
      const tos=LIVE().filter(r=>(r.mid?r.mid===m.rid:r.id===m.id)&&r.to).map(r=>idx(r.to));const last=tos.length?Math.max(...tos):0;

    return b.length?b.length+' member(s): '+lst(b):''});

    const r=pdfBytes([{pw:595,ph:842,dw:100,dh:100,x:0,y:0,w:1,h:1,jpg,footer:''}]);const n=r.size||r.length||0;return n>200?'':'empty or too small output'});
  return out;
}

function collParse(text){
  const lines=String(text).replace(/\r/g,'').split('\n').filter(l=>l.trim());
  const hi=lines.findIndex(l=>/date/i.test(l)&&/debit|credit|withdraw|deposit/i.test(l));
  if(hi<0)return {rows:[],bad:0,err:'Header row not found. The file needs Date, Debit and Credit columns.'};
  const split=l=>l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>c.replace(/^"|"$/g,'').trim());
  const H=split(lines[hi]).map(h=>h.toLowerCase());
  const col=re=>H.findIndex(h=>re.test(h));
  const cD=col(/^date/),cI=col(/instrument|cheque|ref/),cP=col(/particular|narration|description|details/),cDr=col(/debit|withdraw/),cCr=col(/credit|deposit/);
  if(cD<0||cDr<0||cCr<0)return {rows:[],bad:0,err:'Columns needed: Date, Debit, Credit.'};
  const rows=[];let bad=0;
  lines.slice(hi+1).forEach(l=>{const c=split(l);const d=parseDateAny(c[cD]);
    if(!d){bad++;return}
    rows.push({date:d,ref:collMask(cI>=0?c[cI]:''),part:collMask(cP>=0?c[cP]:''),debit:numV(c[cDr]),credit:numV(c[cCr])});});
  return {rows,bad,err:''};
}

  if(!u)return alert('This donor has no mobile number. Add it in Members > Edit.');window.open(u,'_blank','noopener')};
window.saveOpen=e=>{e.preventDefault();const f=new FormData(e.target);S.openingCash=N(f.get('c'));S.openingBank=N(f.get('b'));S.openingBkash=N(f.get('k'));save();draw()};
window.saveMonthOpen=e=>{e.preventDefault();const f=new FormData(e.target);const c=f.get('c'),b=f.get('b');
  if(c==='')delete S.cashInputs[mo];else S.cashInputs[mo]=N(c);
  if(b==='')delete S.bankInputs[mo];else S.bankInputs[mo]=N(b);save();draw()};
window.saveBudget=e=>{e.preventDefault();const f=new FormData(e.target);const exp={};
  [...PCAT,RESID].forEach(c=>exp[c]=N(f.get('e_'+c)));
  S.budget={jumuah:f.get('jumuah')===''?'':N(f.get('jumuah')),other:N(f.get('other')),exp};save();draw()};
window.saveLocale=e=>{e.preventDefault();const g=new FormData(e.target).get('grouping');
  S.locale={grouping:LOCALE_OPTS[g]?g:'en-IN'};auditAdd('UPDATE','settings','locale','Number format set to '+S.locale.grouping);save();draw();alert('Saved')};
window.saveDef=e=>{e.preventDefault();S.defaultStart=new FormData(e.target).get('d')||S.defaultStart;save();draw()};
window.saveTpl=e=>{e.preventDefault();const f=new FormData(e.target);S.templates={due:f.get('due'),advance:f.get('advance'),account:''};save();alert('Saved');draw()};
const encBackup=async()=>{S.lastBackup=Date.now();save();await saveQ;return JSON.stringify(await encStr(JSON.stringify(S),CK,SALT))};
window.exportD=async()=>{$('#bk').value=await encBackup()};
window.exportF=async()=>{const txt=await encBackup();const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='KHM-backup-'+today()+'.khm';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);draw()};
window.importF=inp=>{const file=inp.files[0];if(!file)return;const r=new FileReader();
  r.onload=async()=>{try{const d=await parseBackup(r.result);if(!d.members||!d.receipts||!d.payments)throw new Error('Not a masjid data file');
    const cur=(S&&S.audit)||[];
    const typed=prompt('This REPLACES all current data.\nFile contains: members '+d.members.length+', receipts '+d.receipts.length+', payments '+d.payments.length+', bank '+d.bank.length+'.\nType REPLACE to continue:');
    if(typed!=='REPLACE')return;
    S=d;norm();DB.reset();S.audit=[...cur,{at:new Date().toISOString(),action:'IMPORT',table:'all',key:'file',details:'members '+d.members.length+', receipts '+d.receipts.length}];save();draw();alert('Imported')}catch(err){alert('Import failed: '+err.message)}};
  r.readAsText(file)};
window.changePw=async e=>{e.preventDefault();const f=new FormData(e.target),cur=f.get('cur'),n1=String(f.get('n1')),n2=f.get('n2');
  if(n1.length<12)return alert('নতুন পাসওয়ার্ড কমপক্ষে ১২ অক্ষরের হতে হবে');if(n1!==n2)return alert('নতুন পাসওয়ার্ড দুটি মেলেনি');
  try{await saveQ;const p=JSON.parse(lsGet(VKEY));await decPayload(p,await dKey(cur,unb64(p.salt),p.it||ITER))}catch(x){return alert('বর্তমান পাসওয়ার্ড ভুল')}
  const salt=crypto.getRandomValues(new Uint8Array(16));CK=await dKey(n1,salt,ITER);SALT=salt;save();await saveQ;e.target.reset();
  alert('পাসওয়ার্ড বদলেছে। এখনই নতুন ব্যাকআপ নামান।')};

  $('#main').innerHTML=((tab==='rcp'||tab==='vch')?'':bkBanner())+V[tab]();if(tab==='rcp'||tab==='vch')fitRcp();
  a11y();
}
